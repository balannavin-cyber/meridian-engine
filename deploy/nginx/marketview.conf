# MERDIAN Marketview — :80 IS A REDIRECTOR ONLY. No docroot is served here.
#
# S89 hardening, 2026-10-04. The previous form of this block carried
# `root /var/www/marketview` on `listen 80 default_server`, so ANY request whose
# Host was not marketview.meridianalpha.in — a raw-IP hit included — was served
# the whole SPA and every asset UNAUTHENTICATED, bypassing the oauth2-proxy gate
# that protects :443. MEASURED before the change, not inferred:
#   Host: 13.63.27.85      GET /assets/index-Bp8WxCgw.js -> 200 application/javascript 651242 B
#   Host: nonsense.example GET /                          -> 200 878 B
#   Host: marketview.meridianalpha.in GET /               -> 301  (the certbot block below)
# So the hole was exactly "any Host but the canonical one, on :80".
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # No `root`, no `index`, no `try_files` to a file. Nothing on :80 can serve
    # content from disk. That absence IS the fix; everything below is routing.

    # ACME HTTP-01. Certbot's authenticator here is the NGINX PLUGIN
    # (/etc/letsencrypt/renewal/marketview.meridianalpha.in.conf lines 9-10:
    # authenticator = nginx, installer = nginx), which inserts its OWN temporary
    # server block and does not read this location. THIS LOCATION IS INERT TODAY
    # — stated plainly rather than left to look load-bearing. It is kept so that
    # a later switch to --webroot cannot fail silently, and because Let's Encrypt
    # always validates HTTP-01 over port 80.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Liveness for an UNAUTHENTICATED monitor. Fixed literal; no application data,
    # no docroot read. Consumer: scripts/smoke/smoke_probe_marketview_surfaces.py:213
    # (optional, env MARKETVIEW_URL, not scheduled in any crontab).
    # DELETE THIS BLOCK if you would rather :80 answer nothing but redirects —
    # the cost is that the smoke probe loses its only unauthenticated target,
    # because /_health on :443 is behind the same auth_request as everything else.
    location = /_health {
        default_type application/json;
        return 200 '{"status":"ok","service":"marketview-nginx"}';
    }

    # Everything else — raw IP, unknown Host, every path — to the gated host.
    location / {
        return 301 https://marketview.meridianalpha.in$request_uri;
    }

    access_log /var/log/nginx/marketview.access.log;
    error_log  /var/log/nginx/marketview.error.log;
}

server {
    server_name marketview.meridianalpha.in; # managed by Certbot
    root /var/www/marketview;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location = /_health {
        default_type application/json;
        return 200 '{"status":"ok","service":"marketview-nginx"}';
    }

    access_log /var/log/nginx/marketview.access.log;
    error_log  /var/log/nginx/marketview.error.log;


    auth_request /oauth2/auth;
    error_page 401 = /oauth2/sign_in;
    auth_request_set $email $upstream_http_x_auth_request_email;
    location = /oauth2/auth {
        auth_request off; internal;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }
    location /oauth2/ {
        auth_request off;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }
    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/marketview.meridianalpha.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/marketview.meridianalpha.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = marketview.meridianalpha.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 ;
    listen [::]:80 ;
    server_name marketview.meridianalpha.in;
    return 404; # managed by Certbot


}