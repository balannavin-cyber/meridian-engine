#
# WHY THIS FILE IS IN THE REPO. It lived only on the box. §S68 brought the
# crontab under version control as docs/registers/aws_crontab.txt for exactly
# this reason; §S74.B recorded the identical gap for twenty systemd units and
# three timers and it is STILL OPEN. This config was the third instance —
# TD-S80-NEW-16 — and it was edited during the 2026-09-22 disk-full incident
# with no diff, no review and no presence in a fresh clone.
#
# WHAT CHANGED AT S80. The first glob was added. Before, scope was cron.log
# plus logs/*.log only, which left ~/meridian-engine/shadow_runner.log
# unrotated at 313,728,377 bytes — TD-S73-NEW-1, open since S73, CLOSED by
# this widening. Its .1 gzipped to ~15 MB on the forced first cycle.
#
# copytruncate IS REQUIRED and is not a style choice: every cron job and the
# wsfeed unit hold their append handles open across the rotation, so a rename
# would leave them writing to an unlinked inode.
#
# STILL OUTSIDE SCOPE: ~/meridian-engine/C:\GammaEnginePython\heartbeats/
# (TD-S73-NEW-2) — the directory whose name is a Windows path string, writer
# still unidentified.
#
# Backup of the pre-S80 version on the host: /etc/logrotate.d/meridian.PRE_20260922

/home/ssm-user/meridian-engine/*.log
/home/ssm-user/meridian-engine/logs/*.log
{
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su ssm-user ssm-user
}
